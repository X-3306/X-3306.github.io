<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="X-3306 lab" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>X-3306 lab</title>
  <defs>
    <clipPath id="tile">
      <rect width="512" height="512" rx="108"/>
    </clipPath>

    <!-- lekkie drzenie linii, zeby rysunek wygladal jak reczny -->
    <filter id="wobble" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="2" seed="11" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <!-- ziarno papieru -->
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" result="t"/>
      <feColorMatrix in="t" type="matrix"
        values="0 0 0 0 0.85
                0 0 0 0 0.62
                0 0 0 0 0.4
                0 0 0 0.55 -0.12"/>
    </filter>

    <radialGradient id="glow" cx="50%" cy="46%" r="60%">
      <stop offset="0" stop-color="#261d15"/>
      <stop offset="1" stop-color="#110d0a"/>
    </radialGradient>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#glow)"/>
    <rect width="512" height="512" filter="url(#grain)" opacity="0.22"/>

    <!-- linie zeszytu, ledwo widoczne -->
    <g stroke="#c47f43" stroke-opacity="0.07" stroke-width="2">
      <line x1="0" y1="86" x2="512" y2="84"/>
      <line x1="0" y1="170" x2="512" y2="171"/>
      <line x1="0" y1="254" x2="512" y2="252"/>
      <line x1="0" y1="338" x2="512" y2="340"/>
      <line x1="0" y1="422" x2="512" y2="421"/>
    </g>
    <!-- margines -->
    <line x1="64" y1="0" x2="62" y2="512" stroke="#b5483a" stroke-opacity="0.18" stroke-width="2"/>

    <g filter="url(#wobble)" fill="none" stroke-linecap="round" stroke-linejoin="round">

      <!-- podzialka na luku, jak na tarczy przyrzadu -->
      <g stroke="#a8a090" stroke-opacity="0.75" stroke-width="5">
        <g transform="rotate(-66 256 246)"><line x1="256" y1="80" x2="256" y2="90"/></g>
        <g transform="rotate(-50 256 246)"><line x1="256" y1="76" x2="256" y2="90"/></g>
        <g transform="rotate(-34 256 246)"><line x1="256" y1="80" x2="256" y2="90"/></g>
        <g transform="rotate(-17 256 246)"><line x1="256" y1="79" x2="256" y2="90"/></g>
        <g transform="rotate(0 256 246)"><line x1="256" y1="72" x2="256" y2="90"/></g>
        <g transform="rotate(18 256 246)"><line x1="256" y1="80" x2="256" y2="90"/></g>
        <g transform="rotate(33 256 246)"><line x1="256" y1="78" x2="256" y2="90"/></g>
        <g transform="rotate(51 256 246)"><line x1="256" y1="76" x2="256" y2="90"/></g>
        <g transform="rotate(67 256 246)"><line x1="256" y1="81" x2="256" y2="90"/></g>
      </g>

      <!-- glowny pierscien, narysowany jednym ruchem z lekkim nadjazdem na koncu -->
      <path d="M238 98 C330 86 412 150 407 250 C402 346 331 404 251 399
               C163 394 103 330 107 247 C111 159 176 101 263 99
               C279 98 292 101 304 106"
            stroke="#c47f43" stroke-width="13"/>

      <!-- cienki drugi pierscien, narysowany osobno i troche krzywo -->
      <path d="M262 126 C340 126 384 184 381 248 C378 318 322 372 254 373
               C186 374 132 320 133 250 C134 184 184 132 252 128"
            stroke="#e0a066" stroke-opacity="0.5" stroke-width="4"/>

      <!-- X: dwie kreski, jedna mocniejsza -->
      <path d="M188 176 C226 212 286 284 327 334" stroke="#e0a066" stroke-width="20"/>
      <path d="M330 172 C290 216 229 291 184 336" stroke="#c47f43" stroke-width="16"/>

      <!-- wezel wabik na krawedzi pierscienia -->
      <circle cx="372" cy="343" r="21" stroke="#e0a066" stroke-opacity="0.55" stroke-width="3" stroke-dasharray="5 6"/>
      <circle cx="372" cy="343" r="9" fill="#e0a066" stroke="none"/>
    </g>

    <!-- podpis jak na probce w laboratorium -->
    <text x="256" y="462" text-anchor="middle"
          font-family="'IBM Plex Mono', ui-monospace, 'Courier New', monospace"
          font-size="30" letter-spacing="9" fill="#a8a090" fill-opacity="0.9">3306</text>
  </g>
</svg>
