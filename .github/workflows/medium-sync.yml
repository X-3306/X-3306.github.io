name: Sync Medium articles and deploy site

on:
  schedule:
    - cron: "17 */6 * * *"   
  workflow_dispatch:          

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Pull selected articles from Medium
        run: python3 scripts/update_articles.py
      - name: Commit changes
        run: |
          git config user.name "lab-sync"
          git config user.email "lab-sync@users.noreply.github.com"
          git add articles.json articles.html index.html sitemap.xml
          git diff --cached --quiet || (git commit -m "sync: medium articles" && git push)
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload the updated site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy the updated site
        id: deployment
        uses: actions/deploy-pages@v4
